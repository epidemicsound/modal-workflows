name: Release

# The package is not published to PyPI. A release is a git tag plus a GitHub
# Release with the built sdist and wheel attached, so users can install a pinned
# version with `pip install "modal-workflows @ git+https://github.com/epidemicsound/modal-workflows@vX.Y.Z"`
# or download the wheel directly.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the project version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag '$tag' does not match pyproject version '$version'." >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --title "${{ inputs.tag || github.ref_name }}" \
            --generate-notes \
            dist/*
