name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: black
        run: uv run black --check src tests

      - name: isort
        run: uv run isort --check-only src tests

      - name: flake8
        run: uv run flake8 src tests

      - name: mypy
        run: uv run mypy src

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Only the `dev` extra: the unit tests do not need torch or pytorch-lightning,
      # and skipping them keeps the matrix fast. Integration tests are not run in CI
      # because they launch real Modal apps.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run pytest tests

  build:
    name: Build and import-check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # The package is installed straight from this repository rather than from an
      # index, so a clean-environment install is the check that matters.
      - name: Import the built wheel in a clean environment
        run: |
          uv venv /tmp/import-check
          VIRTUAL_ENV=/tmp/import-check uv pip install dist/*.whl
          /tmp/import-check/bin/python -c "import modal_workflows.workflows, modal_workflows.training; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
